<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="A minimalist task management application demonstrating advanced DOM manipulation and persistent data handling in vanilla JavaScript." />
  <link rel="stylesheet" href="./style.css" /> <!--CSS-->
  <script src="https://kit.fontawesome.com/6fa05d4590.js" crossorigin="anonymous"></script> <!--fontAwesome icons-->
  <title>To-do List</title>
</head>

<body>
  <div class="container">
    <!--whole page's container-->
    <div class="sidebar-container">
      <!--sidebar-->
      <div class="title-container">
        <!--title in sidebar-->
        <h1 class="title">Task Master</h1>
      </div>
      <div class="sidebar-options-container">
        <!--options in sidebar-->
        <ul>
          <li class="option-item">
            <a href="index.html" class="option-link"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a>
          </li>
        </ul>
      </div>
      <div class="sidebar-profile-container">
        <!--profile in sidebar-->
        <!-- <button class="sidebar-newTask-btn">
          <i class="fa-solid fa-plus"></i>New Task
        </button> -->
        <div class="profile-container">
          <img src="./assets/Profile image 2.jpeg" alt="profile image" class="profile-img" />
          <h3 class="profile-username">Mohammad Zali</h3>
        </div>
      </div>
    </div>

    <!-- content -->
    <div class="content-container">
      <!-- notification -->
      <div class="notif-container">
        <div class="blur"></div>
        <h2 class="notif-heading">Welcome back, Mohammad</h2>
        <p class="notif-text">You have <span class="remaining-tasks">0 tasks</span> remaining for today.</p>
        <!-- <button class="notif-newTask-btn">New Task</button> -->
      </div>

      <!-- completion percentage -->
      <div class="completion-container">
        <h2 class="completion-heading">Daily <br> Completion</h2>
        <div class="completion-percentage">
          <div class="inner-completion-percentage"><span>0%</span></div>
        </div>
        <p class="completion-text"><span class="done-tasks">0</span> of <span class="total-tasks">0</span> tasks finished</p>
      </div>

      <!-- add input -->
      <div class="addNew-container">
        <span class="add-icon"><i class="fa-regular fa-square-plus"></i></span>
        <input type="text" class="addNew-input" placeholder="Add a new task">
        <button class="addNew-btn">Add</button>
      </div>

      <!-- tasks -->
      <div class="tasks-container">
        <h2 class="tasks-heading">Today's Tasks</h2>
        <div class="tasks">
          <!-- added tasks will be here -->
        </div>
      </div>

    </div>
  </div>

  <script src="./script.js"></script>
</body>

</html>

<!-- Challenge:
Title: To-do list
=> Build a to-do list app where the user can add tasks, mark them as complete, and delete them. All the tasks should be stored in a JavaScript array that drives what's shown on the page.

Requirements
=> - A text input and an "Add" button — typing a task and clicking Add appends it to the list
- Pressing 'Enter' while the input is focused should also add the task
- Each task has a checkbox — checking it strikes through the text and dims it
- Each task has a delete button that removes it from both the array and the page
- If the input is empty and the user tries to add, show a small inline error message instead of adding a blank task
- A counter at the top shows how many tasks are remaining (uncompleted)
 -->
