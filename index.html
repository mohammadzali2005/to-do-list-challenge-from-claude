<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A minimalist task management application demonstrating advanced DOM manipulation and persistent data handling in vanilla JavaScript.">
    <link rel="stylesheet" href="./style.css">      <!--CSS-->
    <script src="https://kit.fontawesome.com/6fa05d4590.js" crossorigin="anonymous"></script>       <!--fontAwesome icons-->
    <title>To-do List</title>
</head>
<body>
    
    <div class="container">     <!--whole page's container-->
        <div class="sidebar-container">     <!--sidebar-->
            <div class="title-container">   <!--title in sidebar-->
                <h1 class="title">Task Master</h1>
            </div>
            <div class="sidebar-options-container">     <!--options in sidebar-->
                <ul>
                    <li class="option-item"><a href="#" class="option-link"><i class="fa-solid fa-table-cells-large"></i> Dashboard</a></li>
                    <li class="option-item"><a href="#" class="option-link"><i class="fa-solid fa-copy"></i> Projects</a></li>
                    <li class="option-item"><a href="#" class="option-link"><i class="fa-solid fa-chart-column"></i> Analytics</a></li>
                    <li class="option-item"><a href="#" class="option-link"><i class="fa-solid fa-gear"></i> Settings</a></li>
                </ul>
            </div>
            <div class="sidebar-profile-container">     <!--profile in sidebar-->
                <button class="sidebar-newTask-btn"><i class="fa-solid fa-plus"></i>New Task</button>
                <div class="profile-container">
                    <img src="" alt="profile image" class="profile-img">
                    <h3 class="profile-username">Mohammad Zali</h3>
                </div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>

<!-- Challenge:
Title: To-do list
=> Build a to-do list app where the user can add tasks, mark them as complete, and delete them. All the tasks should be stored in a JavaScript array that drives what's shown on the page.

Requirements
=> - A text input and an "Add" button — typing a task and clicking Add appends it to the list
- Pressing 'Enter' while the input is focused should also add the task
- Each task has a checkbox — checking it strikes through the text and dims it
- Each task has a delete button that removes it from both the array and the page
- If the input is empty and the user tries to add, show a small inline error message instead of adding a blank task
- A counter at the top shows how many tasks are remaining (uncompleted)
 -->
